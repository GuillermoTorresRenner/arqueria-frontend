name: Deploy Production Frontend to Hostinger VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKERHUB_REPOSITORY: lanek/abma-frontend
  PROJECT_PATH: /home/deployer/proyectos/abma/prod/front

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Write environment file
        # El secret entra como variable de entorno y se escribe literal: con
        # echo "${{ secrets... }}" bash interpretaba `comillas invertidas` y $.
        env:
          ENV_VARS: ${{ secrets.PROD_ENV_VARS }}
        run: |
          echo "DOCKERHUB_REPOSITORY=$DOCKERHUB_REPOSITORY" > .env
          printf '%s\n' "$ENV_VARS" >> .env

      - name: Extract build-time variables
        id: vars
        run: |
          # Las VITE_* se inyectan en build time; deben ir como --build-arg
          echo "VITE_API_URL=$(grep -E '^VITE_API_URL=' .env | cut -d '=' -f2-)" >> $GITHUB_OUTPUT
          echo "VITE_SOCKET_URL=$(grep -E '^VITE_SOCKET_URL=' .env | cut -d '=' -f2-)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build, tag and push image
        run: |
          COMMIT_TAG=${{ github.sha }}
          docker build \
            --build-arg VITE_API_URL="${{ steps.vars.outputs.VITE_API_URL }}" \
            --build-arg VITE_SOCKET_URL="${{ steps.vars.outputs.VITE_SOCKET_URL }}" \
            -t "$DOCKERHUB_REPOSITORY:prod-$COMMIT_TAG" -t "$DOCKERHUB_REPOSITORY:latest" .
          docker push "$DOCKERHUB_REPOSITORY:prod-$COMMIT_TAG"
          docker push "$DOCKERHUB_REPOSITORY:latest"

      - name: Upload files to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'docker-compose.yml,.env'
          target: ${{ env.PROJECT_PATH }}/
          strip_components: 0
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DOCKERHUB_REPOSITORY,PROJECT_PATH
          script: |
            set -e
            mkdir -p $PROJECT_PATH
            cd $PROJECT_PATH
            chmod 600 .env

            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: docker-compose.yml no encontrado en $PROJECT_PATH"
              exit 1
            fi

            echo "=== Descargando imagen ==="
            for i in 1 2 3; do
              docker pull "$DOCKERHUB_REPOSITORY:latest" && break
              echo "Intento $i falló, reintentando en 10s..."; sleep 10
              [ $i -eq 3 ] && { echo "No se pudo descargar la imagen"; exit 1; }
            done

            docker compose down || true
            docker compose up -d
            docker compose ps
            echo "=== Deploy completado ==="
